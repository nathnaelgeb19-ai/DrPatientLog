{% extends "base.html" %}
{% block title %}{% if mode=='edit' %}Edit{% else %}New{% endif %} patient · {{ clinic_name }}{% endblock %}
{% block content %}
<p style="color:var(--bronze);font-size:0.75rem;font-weight:700;letter-spacing:0.08em;margin:0;">REGISTER</p>
<h2 style="font-family:Georgia,serif;margin:0.2rem 0 1rem;">{% if mode=='edit' %}Edit patient{% else %}New patient{% endif %}</h2>
<div class="panel">
  <form method="post" class="form-grid">
    <div>
      <label>Gregorian date</label>
      <input type="date" name="greg_date" id="greg" class="mobile-date" value="{{ record.greg_date if record else greg }}" required>
    </div>
    <div>
      <label>Ethiopian date (auto)</label>
      <input name="eth_date" id="eth" value="{{ record.eth_date if record else eth }}" readonly>
    </div>
    <div>
      <label>Patient name</label>
      <input name="patient_name" required value="{{ record.patient_name if record else '' }}">
    </div>
    <div>
      <label>Ticket number</label>
      <input name="ticket_no" value="{{ record.ticket_no if record else '' }}">
    </div>
    <div>
      <label>Procedure</label>
      <input name="procedure" id="procedure" list="proc-list" required value="{{ record.procedure if record else '' }}">
      <datalist id="proc-list">{% for p in presets %}<option value="{{ p }}">{% endfor %}</datalist>
    </div>
    <div>
      <label>Price (ETB)</label>
      <div style="display:flex;gap:0.5rem;">
        <input name="total_fee" id="fee" type="number" step="0.01" required value="{{ record.total_fee if record else '' }}">
        <button type="button" class="btn btn-steel" id="suggest">Suggest fee</button>
      </div>
    </div>
    <div>
      <label>Doctor cut (%)</label>
      <input name="doctor_pct" type="number" step="0.1" value="{{ record.doctor_pct if record else 4.0 }}">
    </div>
    <div class="full" style="margin-top:0.5rem;">
      <button class="btn btn-primary" type="submit">{% if mode=='edit' %}Update record{% else %}Save patient record{% endif %}</button>
      <a class="btn btn-ghost" href="{{ url_for('patients') }}" style="margin-left:0.5rem;">Cancel</a>
    </div>
  </form>
</div>
<script>
document.getElementById('greg').addEventListener('change', async function() {
  const r = await fetch('{{ url_for("api_eth_date") }}?greg=' + encodeURIComponent(this.value));
  const j = await r.json();
  document.getElementById('eth').value = j.eth || '';
});
document.getElementById('suggest').addEventListener('click', async function() {
  const proc = document.getElementById('procedure').value;
  const r = await fetch('{{ url_for("api_suggest_fee") }}?procedure=' + encodeURIComponent(proc));
  const j = await r.json();
  if (j.fee != null) document.getElementById('fee').value = j.fee;
  else alert('No preset fee for this procedure');
});
</script>
{% endblock %}
